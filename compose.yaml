services:
  mysql:
    image: mysql:8.4
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smart_helmet}
      MYSQL_USER: ${MYSQL_USER:-smart_helmet}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-development-only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-only}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  mosquitto:
    image: eclipse-mosquitto:2.0
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./infrastructure/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "smart-helmet/healthcheck", "-m", "ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-smart_helmet}?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-smart_helmet}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-local-development-only}
      MQTT_BROKER_URI: tcp://mosquitto:1883
      MQTT_TOPIC: ${MQTT_TOPIC:-smart-helmet/telemetry}
      MQTT_CLIENT_ID: smart-helmet-backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  simulator:
    build: ./simulator
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_TOPIC: ${MQTT_TOPIC:-smart-helmet/telemetry}
      SIMULATOR_DEVICE_ID: ${SIMULATOR_DEVICE_ID:-helmet-sim-001}
      SIMULATOR_INTERVAL_SECONDS: ${SIMULATOR_INTERVAL_SECONDS:-1}
      SIMULATOR_RANDOM_SEED: ${SIMULATOR_RANDOM_SEED:-42}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
  mosquitto-data:
