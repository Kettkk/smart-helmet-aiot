name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Test backend
        run: mvn --batch-mode --file backend/pom.xml test
      - name: Check simulator syntax
        run: python -m py_compile simulator/telemetry_simulator.py
      - name: Verify hardware archive
        run: |
          test -s firmware/esp8266-telemetry/esp8266_telemetry.ino
          test -s firmware/esp8266-telemetry/config.example.h
          test -s firmware/esp32-camera/CameraWebServer.ino
          test -s firmware/esp32-camera/config.example.h
          test -s docs/hardware/helmet-front.jpg
          test -s docs/hardware/field-test.jpg
          test ! -e firmware/esp8266-telemetry/config.h
          test ! -e firmware/esp32-camera/config.h
          grep -q '#include "config.h"' firmware/esp8266-telemetry/esp8266_telemetry.ino
          grep -q '#include "config.h"' firmware/esp32-camera/CameraWebServer.ino
      - name: Test fixed-video pipeline
        run: |
          sh -n scripts/download-video-sample.sh scripts/run-vision-demo.sh scripts/run-vision-benchmark.sh scripts/publish-vision-results.sh
          grep -q '2df5b656d692d7c882a8a504a35223e08fb101974c412f6f62fe71b213feca01' scripts/download-video-sample.sh
          grep -q '49a5a01f2721be546fb45900ea927efcc04431c1abe181a651b53d90547d64c7' scripts/download-video-sample.sh
          python -m pip install --requirement vision-service/requirements-dev.txt
          PYTHONPATH=vision-service pytest vision-service/tests
          python -m py_compile experiments/plot_vision_results.py experiments/export_dashboard_results.py
      - name: Verify network experiment artifacts
        run: |
          python -m pip install --requirement experiments/requirements.txt
          PYTHONPATH=. pytest experiments/tests
          python -m py_compile experiments/network_reliability.py experiments/plot_network_results.py
          python experiments/plot_network_results.py --output-dir /tmp/network-plots
          test -s /tmp/network-plots/delivery_rate_vs_packet_loss.png
          test -s /tmp/network-plots/reconnect_time_vs_outage.png
          test -s /tmp/network-plots/latency_vs_added_delay.png
      - name: Verify backend vision payload
        run: |
          python experiments/export_dashboard_results.py --output /tmp/vision-payload.json
          python -c "import json; data=json.load(open('/tmp/vision-payload.json')); assert data['runs'] and data['operatingPointStride']"
      - name: Build dashboard
        working-directory: dashboard
        run: npm ci --no-audit --no-fund && npm run build
      - name: Audit dashboard dependencies
        working-directory: dashboard
        run: npm audit --audit-level=high
      - name: Validate Compose configuration
        run: docker compose config --quiet
