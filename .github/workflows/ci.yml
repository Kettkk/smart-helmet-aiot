name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test backend
        run: mvn --batch-mode --file backend/pom.xml test
      - name: Check simulator syntax
        run: python -m py_compile simulator/telemetry_simulator.py
      - name: Validate Compose configuration
        run: docker compose config --quiet
