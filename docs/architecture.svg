<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#57606a"/></marker>
    <style>
      .title{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#1f2328}.sub{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#656d76}
      .lane{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;letter-spacing:1.4px}.card-title{font:650 18px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#1f2328}.card-sub{font:400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#656d76}.label{font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#57606a}.note{font:400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#57606a}
      .card{fill:#fff;stroke:#d0d7de;stroke-width:1.5}.flow{fill:none;stroke:#57606a;stroke-width:2.5;marker-end:url(#arrow)}.dash{stroke-dasharray:8 7}.divider{stroke:#d8dee4;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1500" height="900" fill="#ffffff"/>
  <text x="60" y="58" class="title">Smart Helmet AIoT — implemented public architecture</text>
  <text x="60" y="88" class="sub">A live telemetry loop and a controlled offline vision experiment, with archived hardware shown only as provenance</text>

  <rect x="40" y="125" width="1420" height="285" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="65" y="157" class="lane" fill="#0969da">LIVE TELEMETRY PATH</text>
  <g><rect class="card" x="80" y="205" width="230" height="115" rx="10"/><rect x="80" y="205" width="6" height="115" rx="3" fill="#0969da"/><text x="108" y="246" class="card-title">Telemetry simulator</text><text x="108" y="274" class="card-sub">Seeded synthetic records</text><text x="108" y="296" class="card-sub">Hardware-independent input</text></g>
  <g><rect class="card" x="395" y="205" width="190" height="115" rx="10"/><rect x="395" y="205" width="6" height="115" rx="3" fill="#8250df"/><text x="423" y="246" class="card-title">Mosquitto</text><text x="423" y="274" class="card-sub">Local MQTT broker</text><text x="423" y="296" class="card-sub">QoS 1 telemetry</text></g>
  <g><rect class="card" x="670" y="205" width="240" height="115" rx="10"/><rect x="670" y="205" width="6" height="115" rx="3" fill="#1a7f37"/><text x="698" y="246" class="card-title">Spring Boot API</text><text x="698" y="274" class="card-sub">Validation and ingestion</text><text x="698" y="296" class="card-sub">Java 17 · Spring Data JPA</text></g>
  <g><rect class="card" x="995" y="205" width="170" height="115" rx="10"/><rect x="995" y="205" width="6" height="115" rx="3" fill="#1a7f37"/><text x="1023" y="246" class="card-title">MySQL</text><text x="1023" y="274" class="card-sub">Telemetry history</text><text x="1023" y="296" class="card-sub">Flyway schema</text></g>
  <g><rect class="card" x="1240" y="205" width="180" height="115" rx="10"/><rect x="1240" y="205" width="6" height="115" rx="3" fill="#bf8700"/><text x="1268" y="246" class="card-title">Vue dashboard</text><text x="1268" y="274" class="card-sub">Live telemetry</text><text x="1268" y="296" class="card-sub">REST polling · 2 s</text></g>
  <path d="M310 262H395" class="flow"/><text x="325" y="248" class="label">MQTT QoS 1</text><path d="M585 262H670" class="flow"/><text x="603" y="248" class="label">subscribe</text><path d="M910 262H995" class="flow"/><text x="931" y="248" class="label">JPA</text><path d="M910 218C1040 170 1160 170 1240 218" class="flow"/><text x="1060" y="180" class="label">REST polling</text>
  <rect x="92" y="344" width="205" height="42" rx="8" fill="#fff" stroke="#8c959f" stroke-dasharray="6 5"/><text x="110" y="370" class="note">Archived STM32 → ESP8266</text><path d="M297 365H357V319" class="flow dash"/>

  <rect x="40" y="435" width="1420" height="330" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="65" y="467" class="lane" fill="#8250df">OFFLINE VISION EVALUATION</text>
  <g><rect class="card" x="80" y="520" width="235" height="120" rx="10"/><rect x="80" y="520" width="6" height="120" rx="3" fill="#0969da"/><text x="108" y="558" class="card-title">Fixed 20 s video</text><text x="108" y="586" class="card-sub">Public-domain source</text><text x="108" y="608" class="card-sub">Source + output SHA-256</text></g>
  <g><rect class="card" x="405" y="520" width="225" height="120" rx="10"/><rect x="405" y="520" width="6" height="120" rx="3" fill="#8250df"/><text x="433" y="558" class="card-title">YOLO batch pipeline</text><text x="433" y="586" class="card-sub">CPU inference</text><text x="433" y="608" class="card-sub">Controlled frame strides</text></g>
  <g><rect class="card" x="720" y="520" width="245" height="120" rx="10"/><rect x="720" y="520" width="6" height="120" rx="3" fill="#1a7f37"/><text x="748" y="558" class="card-title">Versioned artifacts</text><text x="748" y="586" class="card-sub">JSONL · CSV · summary · plots</text><text x="748" y="608" class="card-sub">Annotated H.264 video</text></g>
  <g><rect class="card" x="1055" y="495" width="265" height="90" rx="10"/><rect x="1055" y="495" width="6" height="90" rx="3" fill="#1a7f37"/><text x="1083" y="534" class="card-title">Backend vision API</text><text x="1083" y="562" class="card-sub">Validated POST · MySQL persistence</text></g>
  <g><rect class="card" x="1055" y="620" width="265" height="90" rx="10"/><rect x="1055" y="620" width="6" height="90" rx="3" fill="#bf8700"/><text x="1083" y="659" class="card-title">Vue dashboard</text><text x="1083" y="687" class="card-sub">GET latest benchmark through REST</text></g>
  <path d="M315 580H405" class="flow"/><text x="331" y="566" class="label">verified MP4</text><path d="M630 580H720" class="flow"/><text x="654" y="566" class="label">outputs</text><path d="M965 560H1055" class="flow"/><text x="977" y="546" class="label">POST summary</text><path d="M1188 585V620" class="flow"/>
  <rect x="92" y="675" width="205" height="42" rx="8" fill="#fff" stroke="#8c959f" stroke-dasharray="6 5"/><text x="115" y="701" class="note">Archived ESP32-CAM</text><path d="M297 696H360V639" class="flow dash"/>

  <line x1="60" y1="808" x2="1440" y2="808" class="divider"/>
  <path d="M65 842H105" class="flow"/><text x="120" y="847" class="note">Implemented, reproducible data flow</text><path d="M405 842H445" class="flow dash"/><text x="460" y="847" class="note">Archived physical origin replaced by controlled input</text>
  <text x="1440" y="847" text-anchor="end" class="note">Offline inference · persisted benchmark REST API · no live video stream</text>
</svg>
